# Let the station see the AirPlay metadata that shairport-sync publishes.
#
# Installed to /etc/systemd/system/smpl-station.service.d/10-nowplaying.conf
#
# What was checked on this Pi
# ---------------------------
#   systemctl show smpl-station -p PrivateTmp   -> PrivateTmp=yes
#   systemctl show shairport-sync -p PrivateTmp -> PrivateTmp=no
#   prw-rw-rw- shairport-sync  /tmp/shairport-sync-metadata
#   drwxrwxrwx shairport-sync  /tmp/shairport-sync/
#
# shairport-sync writes its metadata - track, artist, and the cover art it
# emits as PICT chunks - into the HOST /tmp. The station runs with
# PrivateTmp=yes, which gives it a private /tmp of its own (today:
# /tmp/systemd-private-…-smpl-station.service-ILekZC). From inside that
# namespace /tmp/shairport-sync-metadata simply does not exist. Not
# permission-denied, not empty: absent. Which is a confusing thing to debug,
# because every path in the log looks right.
#
# So: PrivateTmp=no. It is a loosening of the unit's hardening, and it is the
# minimum one that makes the now-playing panel possible at all.
#
# If this turns out not to be needed
# ----------------------------------
# This file exists only for the now-playing panel. If the station reads its
# AirPlay state from somewhere other than /tmp - a D-Bus name, a socket under
# /run, an MQTT topic - then delete this file and run
# `systemctl daemon-reload && systemctl restart smpl-station`. Hardening you
# do not need is hardening you should keep.
#
# Two things to re-test after this lands
# --------------------------------------
# 1. SD-card import. The unit's own header warns that its mount-namespace
#    settings are what the card watcher depends on, and that tightening them
#    breaks "insert a card, nothing happens" silently. This loosens rather
#    than tightens, so it should not break - but "should not" is why the
#    warning is there. Insert a card and watch journalctl.
# 2. That the station still starts at all. PrivateTmp=no means anything the
#    agent writes to /tmp is now visible to, and writable by, every other
#    process on the box. The agent stages imports under
#    /var/lib/smpl-station, not /tmp, so this should be nothing - but check
#    that no tempfile the agent creates leaks something it shouldn't.
#
# Note also that shairport-sync's metadata output is NOT enabled in
# /etc/shairport-sync.conf on this Pi today; the pipe exists but nothing is
# fed through it. Turning it on is a human step at the Pi - see
# docs/PI_STATION.md - and it restarts the AirPlay receiver, which interrupts
# whatever is playing in the workshop at that moment.

[Service]
PrivateTmp=no
