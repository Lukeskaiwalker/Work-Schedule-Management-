# Let the station read the barcode scanner directly.
#
# Installed to /etc/systemd/system/smpl-station.service.d/20-scanner.conf
#
# Why
# ---
# The kiosk screens have no keyboard and nothing focused for a scanner to type
# into. So the agent stops relying on the scanner behaving as a keyboard and
# opens the evdev node itself, which needs read access to /dev/input/eventN.
#
# On this Pi, checked:
#
#   crw-rw---- 1 root input  /dev/input/event4
#   usb-NT_USB_Keyboard-event-kbd -> ../event4      <- the scanner
#   input:x:102:pi,lightdm                          <- smpl-station absent
#   id smpl-station -> smpl-station,lp
#
# The nodes are already root:input 0660 through the stock
# /etc/udev/rules.d/99-com.rules, so there is NO new udev rule to write and
# nothing to loosen on the device. The only thing missing is the group.
#
# SupplementaryGroups= accumulates across drop-ins rather than replacing, so
# the unit's own `SupplementaryGroups=lp` survives this file and the service
# ends up in both lp and input. (Assigning an empty value would reset the
# list - don't.)
#
# Consequence to know before you file a bug
# -----------------------------------------
# Group membership only lets the agent OPEN the device. When the agent then
# grabs it (EVIOCGRAB), the scanner stops being a keyboard for the whole box:
# scans no longer reach the desktop, a terminal, or the Chromium windows. That
# is the intended behaviour - it is how a scan can be routed to the right
# screen instead of to whatever had focus - but it also means that while the
# station is running and holding the grab, you cannot use the scanner to type
# anywhere else. Stop the service to get it back.
#
# This grants read access to every input device on the box, including the
# Logitech keyboard and mouse, not just the scanner. There is no finer group
# than `input` on Bookworm; narrowing it would take a udev rule assigning a
# dedicated group to the scanner's vendor/product, which is a change to a
# stock OS file and was judged not worth it for an appliance in a locked
# workshop with one service account on it.

[Service]
SupplementaryGroups=input
